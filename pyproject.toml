[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civiltools"
version = "1.0.0-alpha.1"
description = "Standalone structural engineering application — seismic analysis, design, and report generation"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [
    { name = "Ebrahim Raeyat Roknabadi" },
]

dependencies = [
    "comtypes>=1.4.9",
    "etabs-api @ git+https://github.com/ebrahimraeyat/etabs_api2.git",
    "pyside6>=6.10.1",
    "fpdf2>=2.8.0",
    "python-docx>=1.2.0",
    "math2docx>=2.0",
    "matplotlib>=3.10.0",
    "ezdxf>=0.19",
    "pywin32>=306",
    "platformdirs>=4.0",
    "numpy>=2.2.2",
    "pandas>=2.2.3",
    "pyyaml",
    "scipy>=1.15.1",
    "jupyter",


#    "pygments>=2.17",
#    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
occ = [
    # pythonocc-core must be installed via conda:
    #   conda install -c conda-forge pythonocc-core=7.9
    # It is NOT available on PyPI.
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "nuitka>=2.0",
    "pyinstaller>=6.0",
    "ruff>=0.3",
    "markitdown[all]>=0.1",
]

[project.scripts]
civiltools = "civiltools.__main__:main"

[project.gui-scripts]
civiltools-gui = "civiltools.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civiltools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
